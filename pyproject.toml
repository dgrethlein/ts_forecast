[project]
name = "ts-forecast"
version = "0.1.0"
description = "Ad hoc time series forecasting git repo"
authors = [
    {name = "David Grethlein",email = "12dgrethlein@gmail.com"}
]
license = "Apache 2.0"
readme = "README.md"
requires-python = ">=3.13,<3.14"
cython="^3.0.0"
dependencies = [
    "numpy (<2.4.0)",
    "pandas (>=2.0.3,<4.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "pylint (>=4.0.6,<5.0.0)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
    "scikit-learn (>=1.6.0,<2.0.0)",
    "sktime (>=1.0.1,<2.0.0)",
    "pyan3 (>=2.6.2,<3.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "pydata-sphinx-theme (>=0.21.0,<0.22.0)",
    "mlflow (>=3.16.1,<4.0.0)",
    "dtaidistance (>=2.5.1,<3.0.0)",
    "igraph (>=1.0.0,<2.0.0)"
]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[dependency-groups]
dev = [
    "cmake (>=4.4.3,<5.0.0)"
]
